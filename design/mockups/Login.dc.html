<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0F1115; color: #E6E8EC; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); text-decoration: none; } a:hover { color: #FFFFFF; }
    .app { --accent: #8B7CF6; width: 1440px; height: 900px; box-sizing: border-box; background: #0F1115; }
    .h { font-family: 'Barlow Semi Condensed', 'Arial Narrow', sans-serif; font-weight: 600; line-height: 1.1; letter-spacing: -0.01em; }
    .mono { font-family: 'IBM Plex Mono', 'Consolas', monospace; font-variant-numeric: tabular-nums; }
    .t2 { color: #9AA3B2; } .t3 { color: #5C6577; }
    .card { background: #161920; border: 1px solid #262B36; border-radius: 8px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 46px; padding: 0 18px; border-radius: 6px; font: 500 15px 'IBM Plex Sans', sans-serif; border: 1px solid #333A48; background: #1C2028; color: #E6E8EC; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #0F1115; font-weight: 600; }
    .ic { display: inline-flex; width: 18px; height: 18px; flex: none; } .ic svg { width: 100%; height: 100%; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .label { font-size: 13px; font-weight: 500; color: #9AA3B2; }
    .input { height: 46px; border-radius: 6px; border: 1px solid #333A48; background: #0F1115; display: flex; align-items: center; padding: 0 14px; color: #E6E8EC; }
    .seg { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 8px; background: #0F1115; border: 1px solid #262B36; }
    .seg > div { height: 40px; display: flex; align-items: center; justify-content: center; border-radius: 6px; font-weight: 500; color: #9AA3B2; }
    .seg > div.on { background: #1C2028; color: #E6E8EC; }
  </style>
</helmet>
<div class="app" style="--accent: {{accent}}; display: flex; align-items: center; justify-content: center; position: relative;">

  <div style="position: absolute; top: 32px; left: 40px; display: flex; align-items: center; gap: 10px;">
    <span class="ic" style="width: 26px; height: 26px; color: var(--accent);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3 21 20H3L12 3Z"></path><path d="M12 9l4.5 9h-9L12 9Z"></path></svg></span>
    <span class="h" style="font-size: 17px; letter-spacing: 0.06em;">PYRAMID IV</span>
    <span class="t3" style="font-size: 12px; letter-spacing: 0.14em; font-weight: 500;">HUB</span>
  </div>

  <div class="card" style="width: 440px; padding: 36px; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div class="h" style="font-size: 32px;">Sign in</div>
      <div class="t2">Team hub for Pyramid IV Esports. Pick your role, then use the credentials your coach gave you.</div>
    </div>

    <div class="seg">
      <div>Player</div>
      <div class="on">Coach</div>
    </div>

    <div class="field">
      <div class="label">Username</div>
      <div class="input">waves</div>
    </div>
    <div class="field">
      <div class="label">Password</div>
      <div class="input mono" style="letter-spacing: 0.2em;">••••••••••</div>
    </div>

    <button class="btn primary" style="width: 100%;">Sign in as coach</button>

    <div style="display: flex; align-items: center; gap: 12px; color: #5C6577; font-size: 13px;">
      <div style="flex: 1; height: 1px; background: #262B36;"></div>
      <span>or</span>
      <div style="flex: 1; height: 1px; background: #262B36;"></div>
    </div>

    <a href="#" style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 6px; border: 1px solid #262B36; background: #0F1115; color: #E6E8EC;">
      <span class="ic" style="color: var(--accent);"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l12-7.5L7 4.5Z"></path></svg></span>
      <span style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-weight: 500;">Watch LEC &amp; LCK pro drafts</span>
        <span class="t3" style="font-size: 13px;">Public — no sign-in needed</span>
      </span>
      <span class="ic t3" style="margin-left: auto;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"></path></svg></span>
    </a>
  </div>

  <div class="t3" style="position: absolute; bottom: 28px; left: 0; right: 0; text-align: center; font-size: 13px;">Beta · Data from Riot Games, Leaguepedia and PandaScore</div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#8B7CF6","options":["#8B7CF6","#F59E0B","#2DD4BF","#FB7185"],"section":"Theme"}}'>
class Component extends DCLogic {
  renderVals() { return { accent: this.props.accent ?? '#8B7CF6' }; }
}
</script>
</body>
</html>
